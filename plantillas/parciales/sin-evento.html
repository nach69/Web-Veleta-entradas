      <article class="espera" id="lista" data-bloque="ninguno" aria-labelledby="espera-titulo">
        <p class="pantalla__marca">{{nombre}}</p>
        <h1 class="pantalla__titulo" id="espera-titulo">Estamos esperando al nuevo programa</h1>
        <p class="pantalla__texto">Déjanos tu email y te avisamos en cuanto haya fecha.</p>
        <form class="lista" action="/api/lista" method="post" novalidate data-formulario>
          <input type="hidden" name="tipo" value="lista">
          <input type="hidden" name="t" value="">
          <div class="lista__fila">
            <label class="sr-only" for="lista-email">Tu email</label>
            <input id="lista-email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="Tu email" required maxlength="150">
            <button class="btn" type="submit">Avisadme</button>
          </div>
          <p class="campo__error" id="lista-email-error"></p>
          <div class="hp" aria-hidden="true">
            <label for="lista-web">No rellenar</label>
            <input id="lista-web" name="web" type="text" tabindex="-1" autocomplete="off">
          </div>
          <p class="form-estado" role="status" aria-live="polite"></p>
          <p class="legal-corto"><span data-texto-alta="lista">Al apuntarte te avisaremos por email del próximo evento de {{nombre}}. Puedes darte de baja cuando quieras.</span> Responsable: {{titular.nombre}}. Más información en la <a href="/privacidad/">política de privacidad</a>.</p>
        </form>
      </article>
