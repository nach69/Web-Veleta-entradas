        <div class="comprar">
          <div class="comprar__email" data-email-compra="{{{modoEmail}}}" data-solo-js hidden>
            <label class="comprar__etiqueta" for="{{{evId}}}-email">{{{etiquetaEmail}}}</label>
            <input id="{{{evId}}}-email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="Tu email" maxlength="150">
            <p class="campo__error" id="{{{evId}}}-email-error"></p>
            <p class="legal-corto"><span data-texto-alta="compra">Si dejas tu email, te escribiremos sobre este y los próximos eventos de {{nombre}}. Puedes darte de baja cuando quieras.</span> Responsable: {{grupo}}. <a href="/privacidad/">Privacidad</a>.</p>
          </div>
          <a class="btn btn--grande" href="{{{evEnlace}}}" rel="noopener" data-comprar data-evento="{{{evNombreTexto}}}">Comprar entrada</a>
          <p class="comprar__nota">La compra se hace en la web de la ticketera.</p>
          <button type="button" class="btn btn--borde btn--peque" data-sonido data-solo-js hidden>Activar sonido</button>
        </div>
