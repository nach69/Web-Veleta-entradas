      <article class="venta" id="{{{evId}}}-venta" data-bloque="{{{evId}}}" aria-labelledby="{{{evId}}}-titulo">
        <p class="pantalla__marca"><img src="/img/logo-veleta-blanco.png" alt="{{nombre}}" width="900" height="275"></p>
        <p class="pantalla__antetitulo">En antena</p>
        <h1 class="pantalla__titulo" id="{{{evId}}}-titulo" tabindex="-1">{{{evNombre}}}</h1>
        <p class="venta__datos"><time datetime="{{{evFechaISO}}}">{{{evFecha}}}</time><span aria-hidden="true"> · </span><span class="venta__lugar">{{{evLugar}}}</span></p>
{{{evEmail}}}
        <h2 class="tramos__titulo">Entradas</h2>
{{{evTramos}}}
        <p class="venta__nota">{{{evNota}}}</p>
      </article>
