  <main id="main" class="landing">
    <!-- 1. Escena: foto del salón (o el gris PROVISIONAL) con la tele. Todo el movimiento lo pone la web. -->
    <section class="escena" aria-label="Un señor viendo la tele en su sillón" data-escena>
      <div class="escena__camara" data-camara>
        <div class="escena__lienzo" data-lienzo>
{{{fondoEscena}}}
          <div class="tele-marco" data-marco aria-hidden="true"></div>
          <div class="tele" data-tele>
{{{emisiones}}}
            <span class="tele__barrido" aria-hidden="true"></span>
            <span class="tele__luz" data-luz aria-hidden="true"></span>
          </div>
{{{primerPlano}}}
        </div>
      </div>
      <span class="escena__grano" aria-hidden="true"></span>
      <span class="escena__vineta" aria-hidden="true"></span>
      <button type="button" class="pastilla pastilla--oscura escena__saltar" data-saltar hidden>Saltar</button>
    </section>

    <!-- 2. Segunda pantalla: venta por tramos (con evento) o lista de espera (sin evento). Funciona sin JavaScript. -->
    <section class="pantalla" aria-live="polite">
{{{pantallas}}}
    </section>
  </main>
